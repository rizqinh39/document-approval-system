image: php:8.2-fpm-alpine

stages:
  - lint
  - test

lint:
  stage: lint
  script:
    - echo "Running linter"

test:
  stage: test
  script:
    - apk add --no-cache postgresql-dev libpng-dev libzip-dev zip unzip $PHPIZE_DEPS
    - docker-php-ext-install pdo_pgsql gd zip bcmath
    - pecl install redis
    - docker-php-ext-enable redis
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - cd backend
    - composer install
    - cp .env.example .env
    - php artisan key:generate
    - php artisan test
